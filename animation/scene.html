<!doctype html>
<html><head><meta charset="utf-8"><title>Six to Picnic</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="rigged/manifest.js"></script>
<script>
'use strict';
// ============================================================================
//  "Six to Picnic" — 15 s, 1920x1080, time-driven 2D cartoon.
//  window.__frame(t) draws the frame for time t (seconds) and returns a PNG data URL.
//  Beats:  0-5 cricket six  ->  seam 1 (ball lands in airbox = launch)
//          5-10 F1 sprint   ->  seam 2 (checkered flag fills frame = blanket)
//          10-15 picnic     ->  cricket ball callback pins the fluttering corner
// ============================================================================
const W=1920,H=1080,TAU=Math.PI*2;
const cv=document.getElementById('c');const ctx=cv.getContext('2d');
const lerp=(a,b,t)=>a+(b-a)*t;const clamp=(x,a,b)=>x<a?a:x>b?b:x;const sat=x=>clamp(x,0,1);
const smooth=x=>{x=sat(x);return x*x*(3-2*x)};
const easeOut=x=>{x=sat(x);return 1-Math.pow(1-x,3)};
const easeIn=x=>{x=sat(x);return x*x*x};
const linear=x=>sat(x);
const ramp=(t,a,b)=>sat((t-a)/(b-a));
function kf(t,keys,ease){ease=ease||smooth;if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const k0=keys[i],k1=keys[i+1];
    if(t<=k1[0]){const e=k1[2]||ease;return lerp(k0[1],k1[1],e((t-k0[0])/(k1[0]-k0[0])));}}
  return keys[keys.length-1][1];}
function kf2(t,keys,ease){return [kf(t,keys.map(k=>[k[0],k[1][0],k[2]]),ease),kf(t,keys.map(k=>[k[0],k[1][1],k[2]]),ease)];}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let LWK=1;const OUT='#2b2640';
function circ(x,y,r,f,s,lw){ctx.beginPath();ctx.arc(x,y,r,0,TAU);if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.lineWidth=(lw||4)*LWK;ctx.strokeStyle=s;ctx.stroke();}}
function ell(x,y,rx,ry,f,s,lw,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,TAU);if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.lineWidth=(lw||4)*LWK;ctx.strokeStyle=s;ctx.stroke();}}
function rrect(x,y,w,h,r,f,s,lw){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.lineWidth=(lw||4)*LWK;ctx.lineJoin='round';ctx.strokeStyle=s;ctx.stroke();}}
function poly(p,f,s,lw,open){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);if(!open)ctx.closePath();if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.lineWidth=(lw||4)*LWK;ctx.lineJoin='round';ctx.strokeStyle=s;ctx.stroke();}}
function line(p,s,lw){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.lineWidth=lw*LWK;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s;ctx.stroke();}
function limb(p,col,w){line(p,OUT,w+7);line(p,col,w);}
function ik(S,T,l1,l2,bend){let dx=T[0]-S[0],dy=T[1]-S[1];let d=Math.hypot(dx,dy)||1e-6;
  if(d>=l1+l2){return [S[0]+dx*l1/d,S[1]+dy*l1/d];}
  const a=(l1*l1-l2*l2+d*d)/(2*d);const h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const px=S[0]+dx*a/d,py=S[1]+dy*a/d;return [px-dy/d*h*bend,py+dx/d*h*bend];}
function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function shade(rgb,k){return `rgb(${clamp(rgb[0]*k,0,255)|0},${clamp(rgb[1]*k,0,255)|0},${clamp(rgb[2]*k,0,255)|0})`;}
function star4(x,y,r,col){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?r*0.35:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fillStyle=col;ctx.fill();}

// ------------------------------------------------------------------ faces
function face(x,y,r,o){o=o||{};const ex=r*0.34,ey=-r*0.02+(o.ly||0)*r*0.08,lx=(o.lx||0)*r*0.1;const er=r*0.1;
  for(const sg of[-1,1]){const cx=x+sg*ex+lx,cy=y+ey;
    if(o.eyes==='happy'){ctx.beginPath();ctx.arc(cx,cy+er*0.8,er*1.4,Math.PI*1.08,Math.PI*1.92);ctx.lineWidth=Math.max(3,r*0.075)*LWK;ctx.strokeStyle=OUT;ctx.lineCap='round';ctx.stroke();}
    else{const rr=o.eyes==='wide'?er*1.4:er*1.05;circ(cx,cy,rr,OUT);circ(cx+rr*0.35,cy-rr*0.35,rr*0.32,'#fff');}}
  if(o.brows){for(const sg of[-1,1]){const cx=x+sg*ex+lx,cy=y+ey-er*2.6-(sg===o.browSide?(o.browUp||0)*r*0.1:0);
    line([[cx-er*1.1,cy+er*0.25*(o.brows>0?-sg:sg)],[cx+er*1.1,cy-er*0.25*(o.brows>0?-sg:sg)]],o.browCol||OUT,Math.max(3,r*0.06));}}
  ell(x-ex-r*0.18+lx,y+r*0.3,r*0.14,r*0.08,'rgba(255,110,140,0.42)');ell(x+ex+r*0.18+lx,y+r*0.3,r*0.14,r*0.08,'rgba(255,110,140,0.42)');
  const my=y+r*0.44;const m=o.mouth||'smile';const mw=Math.max(3,r*0.065)*LWK;
  if(m==='smile'){ctx.beginPath();ctx.arc(x+lx,my-r*0.12,r*0.22,Math.PI*0.15,Math.PI*0.85);ctx.lineWidth=mw;ctx.strokeStyle=OUT;ctx.lineCap='round';ctx.stroke();}
  else if(m==='grin'){ctx.beginPath();ctx.arc(x+lx,my-r*0.14,r*0.27,0,Math.PI);ctx.closePath();ctx.fillStyle='#4a2a3a';ctx.fill();ctx.lineWidth=mw;ctx.strokeStyle=OUT;ctx.lineJoin='round';ctx.stroke();
    ell(x+lx,my+r*0.05,r*0.11,r*0.06,'#ff86a6');}
  else if(m==='o'){ell(x+lx,my,r*0.1,r*0.13,'#4a2a3a',OUT,3);}
  else if(m==='flat'){line([[x+lx-r*0.13,my],[x+lx+r*0.13,my]],OUT,Math.max(3,r*0.06));}
  else if(m==='grit'){rrect(x+lx-r*0.2,my-r*0.07,r*0.4,r*0.14,r*0.05,'#fff',OUT,3);line([[x+lx,my-r*0.07],[x+lx,my+r*0.07]],OUT,2);}
}

// ------------------------------------------------------------------ sprites
const SPR={img:{},man:window.SPRITE_MANIFEST||{}};
const F_BAT=300/891,F_BOW=300/881,F_MAR=320/965,F_CAR=560/944,F_HAL=600/917;
function loadSprites(){const ps=[];for(const c in SPR.man)for(const p in SPR.man[c]){const im=new Image();const k=c+'/'+p;SPR.img[k]=im;ps.push(new Promise(r=>{im.onload=r;im.onerror=()=>{console.error('missing sprite '+k);r();};}));im.src='rigged/'+k+'.png';}return Promise.all(ps);}
function sprMeta(key){const i=key.indexOf('/');return SPR.man[key.slice(0,i)][key.slice(i+1)];}
function drawSprite(key,x,y,f,o){o=o||{};const m=sprMeta(key),im=SPR.img[key];if(!m||!im||!im.width)return;const w=m.w*f,h=m.h*f;const px=(m.anchors.pivot||m.anchors.feet)[0]*w;
  ctx.save();ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);if(o.sq&&o.sq!==1)ctx.scale(1/Math.sqrt(o.sq),o.sq);if(o.alpha!==undefined)ctx.globalAlpha*=o.alpha;if(o.mirror)ctx.scale(-1,1);
  ctx.drawImage(im,-px,-h,w,h);ctx.restore();}
function sprAnchor(key,name,x,y,f,o){o=o||{};const m=sprMeta(key);const a=m.anchors[name];const w=m.w*f,h=m.h*f;const px=(m.anchors.pivot||m.anchors.feet)[0]*w;
  let lx=a[0]*w-px,ly=(a[1]-1)*h;if(o.mirror)lx=-lx;if(o.sq&&o.sq!==1){lx/=Math.sqrt(o.sq);ly*=o.sq;}
  if(o.rot){const c=Math.cos(o.rot),s=Math.sin(o.rot);const nx=lx*c-ly*s,ny=lx*s+ly*c;lx=nx;ly=ny;}return [x+lx,y+ly];}
function poseMix(t,keys,fade){let i=0;while(i<keys.length-1&&t>=keys[i+1][0])i++;const out=[[keys[i][1],1]];
  if(i>0){const dt=t-keys[i][0];if(dt<fade){out[0][1]=dt/fade;out.unshift([keys[i-1][1],1-dt/fade]);}}return out;}

// ============================================================================
//  WORLD 1: stadium + race track (one continuous side-view world)
// ============================================================================
const CAR0=3300;
function carX(t){if(t<5.35)return CAR0;const u=t-5.35,V=2300,K=0.75;return CAR0+V*(u-K*(1-Math.exp(-u/K)));}
function carV(t){if(t<5.35)return 0;return 2300*(1-Math.exp(-(t-5.35)/0.75));}
const XF=carX(8.6);           // finish line world x
const MX=XF+180;              // marshal world x
function carSquash(t){if(t<5.0)return 1;const u=t-5.0;return 1-0.2*Math.exp(-u*6)*Math.sin(TAU*u*2.3);}
function carTilt(t){const u=t-5.35;if(u<0)return 0;return -0.14*Math.sin(Math.PI*sat(u/0.5))*Math.exp(-u*1.5);}
const T_HIT=1.3,T_LAND=5.0,GRAV=900,TF=T_LAND-T_HIT;
let HIT=[45,-100],LX=0,LY=0,VX=0,VY=0,B0=[330,-230];
function initRig(){HIT=sprAnchor('batter/contact','bat',0,0,F_BAT);B0=sprAnchor('bowler/release','ball',bowlerX(0.8),bowlerBob(0.8),F_BOW);const a=carLocalAnchor('airbox');LX=CAR0+a[0];LY=a[1];VX=(LX-HIT[0])/TF;VY=(LY-HIT[1]-0.5*GRAV*TF*TF)/TF;}
function bowlerX(t){return kf(t,[[0,980],[0.8,330,linear],[1.3,250,easeOut]]);}
function ballPos(t){
  if(t<0.8)return B0;
  if(t<1.07){const u=ramp(t,0.8,1.07);return [lerp(B0[0],165,u),lerp(B0[1],-14,u*u)];}
  if(t<T_HIT){const u=ramp(t,1.07,T_HIT);return [lerp(165,HIT[0],u),lerp(-14,HIT[1],easeOut(u))];}
  if(t<T_LAND){const u=t-T_HIT;return [HIT[0]+VX*u,HIT[1]+VY*u+0.5*GRAV*u*u];}
  const u=t-T_LAND;const settle=-Math.abs(Math.sin(u*TAU*1.6))*46*Math.exp(-u*5);const ab=carAirboxWorld(t);
  return [ab[0],ab[1]+settle-6];
}
function ballSpin(t){if(t<T_HIT)return t*20;if(t<T_LAND)return (t-T_HIT)*26;return (T_LAND-T_HIT)*26;}
function flagTheta(t){ // pole tilt from vertical, + = toward +x
  const wave=0.52*Math.sin(TAU*1.45*(t-7.8));const env=smooth(ramp(t,7.5,8.0))*(1-smooth(ramp(t,9.25,9.7)));
  return 0.22+wave*env+0.1*smooth(ramp(t,9.25,9.7));}
function flagQuadWorld(t){let P=[0,0];for(const [p,a] of poseMix(t,MARSHAL_POSES,0.1)){const q=sprAnchor('marshal/'+p,'top',MX,-150-marshalHop(t),F_MAR,{rot:marshalRot(t)});P[0]+=q[0]*a;P[1]+=q[1]*a;}
  const ph=flagTheta(t)-0.22;const dn=[-Math.sin(ph),Math.cos(ph)],rt=[Math.cos(ph),Math.sin(ph)];const FH=130,FL=260;
  const TL=P,BL=[P[0]+dn[0]*FH,P[1]+dn[1]*FH];return [TL,[TL[0]+rt[0]*FL,TL[1]+rt[1]*FL],[BL[0]+rt[0]*FL,BL[1]+rt[1]*FL],BL,P];}
function quadCenter(Q){return [(Q[0][0]+Q[1][0]+Q[2][0]+Q[3][0])/4,(Q[0][1]+Q[1][1]+Q[2][1]+Q[3][1])/4];}

function shakeAB(t){let a=0;
  if(t>=T_HIT&&t<T_HIT+0.5)a+=14*Math.exp(-(t-T_HIT)*9);
  if(t>=5.0&&t<5.6)a+=10*Math.exp(-(t-5.0)*7);
  if(t>5.3&&t<9.0)a+=1.6*sat(carV(t)/2300)*(1-ramp(t,8.4,9.0));
  return [a*Math.sin(t*173.3)+a*0.5*Math.sin(t*61),a*Math.sin(t*131.7+1)];}
function camAB(t){
  const b=ballPos(t);const pre={x:240,y:-250,z:1.0};
  const f=smooth(ramp(t,1.3,2.0));
  const lead=kf(t,[[1.3,120],[3,260],[5,200],[6.6,470],[9,470]]);
  const ty=b[1]+kf(t,[[1.3,160],[2.6,520],[4.4,260],[5.4,140],[9,120]]);
  let x=lerp(pre.x,b[0]+lead,f),y=lerp(pre.y,ty,f);
  let z=kf(t,[[0,1.22],[1.3,1.25],[1.6,1.1],[3.0,0.36],[4.6,0.62],[5.0,0.8],[5.45,0.98],[6.8,0.72],[8.3,0.72],[9.4,1.6]]);
  const g=smooth(ramp(t,8.3,9.35));const fq=flagQuadWorld(t);const fc=quadCenter(fq);
  x=lerp(x,fc[0],g);y=lerp(y,fc[1],g);
  y=Math.min(y,230-540/z);
  const s=shakeAB(t);return {x:x+s[0]/z,y:y+s[1]/z,z:z};
}
function proj(cam,p){return [(p[0]-cam.x)*cam.z+W/2,(p[1]-cam.y)*cam.z+H/2];}
function applyCam(cam){ctx.setTransform(cam.z,0,0,cam.z,W/2-cam.x*cam.z,H/2-cam.y*cam.z);}

// --- precomputed scenery
const R=rng(7);
const CROWD_COLS=['#ff8a80','#ffd54f','#80d8ff','#b9f6ca','#ea80fc','#ffffff','#ffab91','#8c9eff'];
const standCrowd=[];(function(){for(const side of[-1,1]){for(let k=0;k<9;k++){const y=-90-k*64;const x0=590+k*110;for(let x=x0;x<1660;x+=27){standCrowd.push([side*(x+R()*8),y-R()*6,CROWD_COLS[(R()*CROWD_COLS.length)|0],R()*TAU]);}}}})();
const tileCrowd=[];(function(){for(let r=0;r<4;r++){for(let x=30;x<1170;x+=26){tileCrowd.push([x+R()*8,-150-r*58-R()*6,CROWD_COLS[(R()*CROWD_COLS.length)|0],R()*TAU]);}}})();
const CONFETTI=[];(function(){const r3=rng(33);for(let i=0;i<110;i++){const side=r3()<0.5?-1:1;CONFETTI.push([side*(600+r3()*1100),-950-r3()*500,CROWD_COLS[(r3()*CROWD_COLS.length)|0],r3()*TAU,110+r3()*120]);}})();
const CLOUDS=[];(function(){const r2=rng(21);for(let i=0;i<60;i++){CLOUDS.push({x:-2500+r2()*14000,y:-250-r2()*2600,s:0.6+r2()*1.3,p:0.35+r2()*0.5});}})();
function cloud(x,y,s,alpha){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,60,0,TAU);ctx.arc(60,-14,48,0,TAU);ctx.arc(-62,-6,44,0,TAU);ctx.arc(110,8,36,0,TAU);ctx.arc(-110,12,32,0,TAU);ctx.fill();
  ctx.fillStyle='#e6f2fb';ctx.beginPath();ctx.ellipse(0,32,140,22,0,0,TAU);ctx.fill();ctx.restore();}

function drawSkyAB(cam,t){ctx.setTransform(1,0,0,1,0,0);
  const y0=proj(cam,[0,-3400])[1],y1=proj(cam,[0,120])[1];const g=ctx.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,'#3d8fe0');g.addColorStop(0.55,'#86c9f7');g.addColorStop(1,'#d8f1ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // sun (parallax .15)
  const sp=proj({x:cam.x*0.15,y:cam.y*0.15,z:cam.z},[-900,-1500]);ctx.save();ctx.translate(sp[0],sp[1]);
  ctx.globalAlpha=0.35;ctx.fillStyle='#fff3b0';for(let i=0;i<12;i++){ctx.save();ctx.rotate(i*TAU/12+t*0.1);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-40*cam.z-10,-260*cam.z-60);ctx.lineTo(40*cam.z+10,-260*cam.z-60);ctx.fill();ctx.restore();}
  ctx.globalAlpha=1;const SR=110*cam.z+30;circ(0,0,SR,'#ffe680');circ(0,0,SR*0.74,'#fff6c2');face(0,SR*0.05,SR*0.62,{eyes:'happy',mouth:'smile'});ctx.restore();
  for(const c of CLOUDS){const p=proj({x:cam.x*c.p,y:cam.y*c.p+(1-c.p)*-800,z:cam.z},[c.x,c.y]);if(p[0]<-400||p[0]>W+400||p[1]<-300||p[1]>H+300)continue;cloud(p[0],p[1],c.s*cam.z*1.3,0.95);}
  const bp=proj({x:cam.x*0.5,y:cam.y*0.5-400,z:cam.z},[2600+t*25,-1500+Math.sin(t*0.8)*30]);if(bp[0]>-300&&bp[0]<W+300&&bp[1]>-400&&bp[1]<H+300)drawBalloon(bp[0],bp[1],cam.z*1.1);
}
function drawBalloon(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.arc(0,0,90,0,TAU);ctx.save();ctx.clip();for(let i=-3;i<3;i++)for(let j=-3;j<3;j++){ctx.fillStyle=((i+j)&1)?'#23242e':'#f6f2e6';ctx.fillRect(i*30,j*30,30,30);}ctx.restore();
  ctx.lineWidth=4;ctx.strokeStyle=OUT;ctx.stroke();line([[-40,80],[-22,140]],OUT,3);line([[40,80],[22,140]],OUT,3);rrect(-28,138,56,36,8,'#b8793f',OUT,4);circ(0,150,6,'#ffd9b8');ctx.restore();}
const BIRDS=[[1500,-1340],[1650,-1300],[1580,-1420]];
function drawBirdsAB(t){for(let i=0;i<BIRDS.length;i++){const [bx0,by0]=BIRDS[i];const bx=bx0-60*t,by=by0+Math.sin(t*2+i)*12;
    const tn=(bx0-HIT[0]+VX*T_HIT)/(VX+60);const d=smooth(ramp(t,tn-0.2,tn+0.05))*(1-smooth(ramp(t,tn+0.3,tn+1.2)));
    const x=bx+d*(i-1)*90,y=by-d*(150+i*40);const f=Math.sin(t*(14+d*18)+i)*12;line([[x-22,y+f],[x,y-6],[x+22,y+f]],OUT,5);
    if(d>0.3){ctx.save();ctx.globalAlpha=d;ctx.fillStyle='#ff5a5a';ctx.font='bold 70px sans-serif';ctx.textAlign='center';ctx.fillText('!',x,y-40);ctx.restore();}}}
function drawHillsAB(cam){ // parallax layers at ground level
  for(const [p,col,amp,per,yb] of [[0.45,'#9ad67a',120,900,-40],[0.7,'#7fc763',70,520,-10]]){
    const c2={x:cam.x*p,y:cam.y,z:cam.z};applyCam(c2);const x0=c2.x-W/cam.z,x1=c2.x+W/cam.z;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x0,400);
    for(let x=x0;x<=x1+40;x+=40){ctx.lineTo(x,yb-amp*(0.5+0.5*Math.sin(x/per*TAU))-amp*0.3*Math.sin(x/per*1.7*TAU+1));}
    ctx.lineTo(x1,400);ctx.closePath();ctx.fill();
    if(p>0.6){for(let x=Math.floor(x0/300)*300;x<x1;x+=300){const h=70+40*Math.sin(x*0.013);line([[x,0],[x,-h]],'#8a5a3a',14);circ(x,-h-10,55+15*Math.sin(x*0.02),'#4fa85e',OUT,3);}}
  }
  applyCam(cam);
}
function drawGroundAB(cam){applyCam(cam);const x0=cam.x-W/cam.z,x1=cam.x+W/cam.z;ctx.fillStyle='#78c850';ctx.fillRect(x0,0,x1-x0,4000);
  ctx.fillStyle='#6cb846';for(let x=Math.floor(x0/160)*160;x<x1;x+=160){ctx.fillRect(x,40+((x/160)&1)*30,80,10);} }
function drawStadium(t){
  // stands
  for(const s of[-1,1]){poly([[s*560,0],[s*560,-60],[s*1560,-640],[s*1680,-640],[s*1680,0]],'#c9cfe3',OUT,6);
    for(let k=1;k<9;k++){const y=-60-k*64;line([[s*(560+k*110),y],[s*1680,y]],'#aab2cf',6);}
    rrect(s*1680-(s>0?0:60),-640,60,640,0,'#9aa5c8',OUT,5);
    // roof
    poly([[s*1740,-700],[s*700,-440],[s*700,-400],[s*1740,-660]],'#8ea0c8',OUT,5);line([[s*1740,-700],[s*1740,-640]],OUT,6);
    // floodlight
    line([[s*1820,0],[s*1820,-900]],'#9aa3bd',16);rrect(s*1820-70,-980,140,70,14,'#5b6482',OUT,5);for(let i=0;i<4;i++)circ(s*1820-45+i*30,-945,10,'#fff6a0');
  }
  // crowd (bounce after the six)
  const jump=smooth(ramp(t,1.4,2.0));

  let Qb=s>0?blanketQuad(t):null;let base;if(s<=0)base=Qf;else if(s>=1)base=Qb;else base=Qf.map((p,i)=>[lerp(p[0],Qb[i][0],s),lerp(p[1],Qb[i][1],s)]);
  const Z=seamZ(t);const piv=quadCenter(base);
  return {Q:base.map(p=>[piv[0]+(p[0]-piv[0])*Z,piv[1]+(p[1]-piv[1])*Z]),Z:Z,s:s};}
function clothWaveFn(t,Z,s){ // flag wave (along u, free end) blended into hanging-blanket wave (along v) then settle
  const flagAmp=kf(t,[[7,10],[8.3,22],[9.3,26],[10.4,26]]);const blAmp=kf(t,[[10,24],[11.0,22],[11.5,14],[11.95,3],[12.2,0]]);
  const pressed=smooth(ramp(t,12.95,13.05))*(1-smooth(ramp(t,13.32,13.45)));const flap=smooth(ramp(t,12.2,12.7))*(1-pressed)*(1-smooth(ramp(t,14.45,14.6)));const landed=smooth(ramp(t,11.6,11.95));
  return (u,v)=>{const phF=TAU*1.7*u-TAU*2.7*t,phB=TAU*1.15*v-TAU*1.7*t+0.9*u;
    let dy=lerp(flagAmp*u*Math.sin(phF),blAmp*v*Math.sin(phB),s)*Z;let sh=lerp(Math.cos(phF)*u*0.8,Math.cos(phB)*v*0.7,s);
    if(landed>0){ // perspective shading on ground + corner flap
      const g=Math.exp(-((u/0.3)*(u/0.3)+((1-v)/0.4)*((1-v)/0.4)));const fl=flap*g*(0.55+0.45*Math.sin(TAU*2.7*t));
      dy=lerp(dy,-fl*95,landed);sh=lerp(sh,-0.15+fl*0.9+0.08*Math.sin(u*9+v*5),landed);return [lerp(0,-fl*40,landed),dy,sh];}
    return [0,dy,sh];};}

// ============================================================================

function drawPicnicBG(t){ctx.setTransform(1,0,0,1,0,0);LWK=1;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6fc1f5');g.addColorStop(0.6,'#c9ecff');g.addColorStop(1,'#e9f8ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(1600,170);ctx.globalAlpha=0.35;ctx.fillStyle='#fff3b0';for(let i=0;i<12;i++){ctx.save();ctx.rotate(i*TAU/12+t*0.12);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-60,-330);ctx.lineTo(60,-330);ctx.fill();ctx.restore();}ctx.globalAlpha=1;circ(0,0,120,'#ffe680');circ(0,0,88,'#fff6c2');face(0,6,74,{eyes:'happy',mouth:'smile'});ctx.restore();
  cloud(300+t*12,180,1.1,0.95);cloud(900+t*8,110,0.8,0.9);cloud(1350+t*10,260,0.9,0.9);
  // hills
  ctx.fillStyle='#9ad67a';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=40)ctx.lineTo(x,700-110*Math.sin(x/900*Math.PI)-60*Math.sin(x/300+2));ctx.lineTo(W,H);ctx.fill();
  ctx.fillStyle='#86cc66';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=40)ctx.lineTo(x,770-70*Math.sin(x/600*Math.PI+1)-30*Math.sin(x/200));ctx.lineTo(W,H);ctx.fill();
  // far trees
  for(const [x,y,s] of [[520,690,0.8],[760,715,0.6],[1320,700,0.7],[1800,690,0.8],[1620,725,0.55]]){line([[x,y+60],[x,y]],'#8a5a3a',12*s);circ(x,y-30*s,60*s,'#4fa85e',OUT,3);circ(x-25*s,y-5*s,40*s,'#5bb86a');}
  // grass
  ctx.fillStyle='#78c850';ctx.fillRect(0,820,W,H-820);ctx.fillStyle='#6cb846';const r2=rng(5);for(let i=0;i<70;i++){const x=r2()*W,y=830+r2()*250;ctx.fillRect(x,y,30+r2()*40,8);}
  // big tree right
  line([[190,900],[180,620]],'#8a5a3a',46);circ(180,560,150,'#4fa85e',OUT,5);circ(80,620,100,'#5bb86a');circ(290,640,95,'#5bb86a');circ(210,470,90,'#5bb86a');
  // flowers
  for(const [x,y,c] of [[140,980,'#ff8fb1'],[260,1040,'#ffd54f'],[1640,990,'#ff8fb1'],[1800,1050,'#fff'],[90,890,'#fff'],[1500,1060,'#ffd54f']]){line([[x,y+22],[x,y]],'#3f9a45',5);for(let k=0;k<5;k++)circ(x+Math.cos(k*TAU/5)*9,y+Math.sin(k*TAU/5)*9,7,c);circ(x,y,5,'#ffd54f');}
  // dandelion seeds + butterflies
  for(let i=0;i<4;i++){const x=((t*35+i*520+Math.sin(t+i)*20)%(W+200))-100,y=420+i*110+Math.sin(t*1.3+i*2)*40;ctx.globalAlpha=0.85;line([[x,y],[x+6,y+16]],'#f4f4f4',2);for(let k=0;k<6;k++){const a=k*TAU/6+t;line([[x,y],[x+Math.cos(a)*10,y+Math.sin(a)*10]],'#ffffff',1.5);}ctx.globalAlpha=1;}
  for(const [cx,cy,ph,col] of [[300,900,0,'#ff9ecb'],[1760,960,2,'#ffd54f']]){const x=cx+Math.sin(t*0.9+ph)*90+Math.sin(t*2.3)*20,y=cy+Math.cos(t*1.3+ph)*50-30;const fl=Math.abs(Math.sin(t*16+ph));
    ctx.save();ctx.translate(x,y);for(const sg of[-1,1]){ell(sg*9*fl,0,9*fl,7,col,OUT,2);}line([[0,-6],[0,6]],OUT,3);ctx.restore();}
  // birds
  if(t>10.3){for(const [x0,y0,sp,ph] of [[-100,220,150,0],[-220,300,130,1.3],[-60,150,170,2.1]]){const x=x0+(t-10.3)*sp,y=y0+Math.sin(t*3+ph)*10;const f=Math.sin(t*12+ph)*10;line([[x-18,y+f],[x,y-6],[x+18,y+f]],OUT,4);}}
}
function drawBasket(x,y){rrect(x-70,y-80,140,80,14,'#b8793f',OUT,5);for(let i=1;i<4;i++)line([[x-66,y-80+i*20],[x+66,y-80+i*20]],'#9c6330',3);ctx.beginPath();ctx.arc(x,y-80,55,Math.PI,TAU);ctx.lineWidth=10;ctx.strokeStyle='#8a5a3a';ctx.stroke();ctx.lineWidth=4;ctx.strokeStyle=OUT;ctx.stroke();
  rrect(x-60,y-92,60,22,6,'#ff6b6b',OUT,3);circ(x+35,y-92,16,'#7ed957',OUT,3);line([[x+35,y-108],[x+40,y-118]],'#3f9a45',4);}
function picnicBall(t,hz){if(t<13.0)return null;const rh=hz?hz.reach:[974,935];const rest=[rh[0]-30,988],placed=[rh[0]+34,980];
  if(t<14.25){const u=easeOut(ramp(t,13.0,13.85));const x=lerp(-60,rest[0],u);return {p:[x,rest[1]],spin:x/22};}
  if(t<14.55){const u=smooth(ramp(t,14.25,14.55));return {p:[lerp(rest[0],placed[0],u),lerp(rest[1],placed[1],u)-Math.sin(Math.PI*u)*30],spin:rest[0]/22};}
  return {p:placed,spin:rest[0]/22};}
const HAL_POSES=[[0,'neutral'],[11.0,'release'],[12.0,'hop'],[12.5,'sit'],[12.9,'reach'],[13.3,'sit'],[13.85,'reach'],[14.6,'thumbs']];
function halState(t){const hop=ramp(t,12.0,12.5);const x=lerp(960,1160,smooth(hop));const air=-140*Math.sin(Math.PI*hop);const base=lerp(905,940,smooth(hop))+air;
  const sq=t>12.5&&t<12.85?1-0.1*Math.sin(Math.PI*ramp(t,12.5,12.85)):1;const bob=t<11.0?Math.sin(t*TAU*0.9)*4:0;return {x:x,base:base+bob,sq:sq};}
function halHands(t){const s=halState(t);return [sprAnchor('footballer/neutral','handL',s.x,s.base,F_HAL),sprAnchor('footballer/neutral','handR',s.x,s.base,F_HAL)];}
function drawHaaland(t){const s=halState(t);for(const [p,a] of poseMix(t,HAL_POSES,0.1))drawSprite('footballer/'+p,s.x,s.base,F_HAL,{alpha:a,sq:s.sq});
  const hh=halHands(t);return {handL:hh[0],handR:hh[1],reach:sprAnchor('footballer/reach','hand',s.x,s.base,F_HAL),x:s.x};}
function drawPicnicFX(t){if(t<14.5)return;const u=ramp(t,14.5,14.9);const r2=rng(3);for(let i=0;i<9;i++){const x=880+r2()*500,y=560+r2()*420,d=r2()*0.3;const k=sat((u-d)/0.5);const s=Math.sin(Math.PI*k)*(14+r2()*14);if(k>0&&k<1)star4(x,y,s,i%2?'#fff6a0':'#ffffff');}
  // tiny heart
  const k=smooth(ramp(t,14.55,14.8));ctx.save();ctx.translate(1300,520-40*k);ctx.scale(k,k);ctx.fillStyle='#ff6b8a';ctx.beginPath();ctx.moveTo(0,22);ctx.bezierCurveTo(-40,-10,-16,-40,0,-18);ctx.bezierCurveTo(16,-40,40,-10,0,22);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OUT;ctx.stroke();ctx.restore();}

//  MASTER FRAME

function frame(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);LWK=1;
  let cam=null;
  if(t<10.0){cam=drawWorldAB(t);}
  else{ // picnic world; camAB still needed for the cloth blend math
    cam=camAB(t);drawPicnicBG(t);}
  const picnic=t>=10.0;
  let cloth=null;if(t>=7.0){cloth=clothScreenQuad(t,cam);}
  ctx.setTransform(1,0,0,1,0,0);LWK=1;
  let hz=null;
  if(picnic){
    const standingBehind=t<11.9;
    if(standingBehind){hz=drawHaaland(t);}
    if(t<11.9)drawBasket(1520,905);
    if(false){const sc=kf(t,[[12.6,0],[12.78,1.2,easeOut],[12.95,1]]);ctx.save();ctx.translate(1400,930);ctx.scale(sc,sc);
      rrect(-14,-80,28,70,8,'#ffe066',OUT,4);rrect(-8,-92,16,16,4,'#7fc4f2',OUT,3);line([[4,-80],[14,-108]],'#ff5a5a',4);
      poly([[30,0],[110,0],[70,-62]],'#f5deb3',OUT,4);poly([[36,-4],[104,-4],[70,-50]],'#7ed957');poly([[44,-8],[96,-8],[70,-40]],'#ff6b6b');ctx.restore();}
  }
  if(cloth){ // flag pole (world) before seam
    drawCloth(cloth.Q,clothWaveFn(t,cloth.Z,cloth.s),[8,6],4,Math.max(3,4*Math.min(cloth.Z,1.5)));
    if(!picnic){applyCam(cam);LWK=clamp(Math.pow(1/cam.z,0.55),1,2.4);const b=ballPos(t);drawBall(b[0],b[1],21,ballSpin(t),1,t);ctx.setTransform(1,0,0,1,0,0);LWK=1;}
  }
  if(picnic){
    if(t>=11.9){hz=drawHaaland(t);}
    const bp=picnicBall(t,hz);
    if(bp){ // dust puffs while rolling
      if(t>13.0&&t<13.9){ctx.globalAlpha=0.5*(1-ramp(t,13.5,13.9));for(let i=0;i<3;i++)circ(bp.p[0]-40-i*35,996-i*6,12+i*6,'#e9efd6');ctx.globalAlpha=1;}
      drawBall(bp.p[0],bp.p[1],22,bp.spin,1,t);
    }
    if(t>=11.9){drawBasket(1520,905);
      if(t>12.6){const sc=kf(t,[[12.6,0],[12.78,1.2,easeOut],[12.95,1]]);ctx.save();ctx.translate(1400,930);ctx.scale(sc,sc);
        rrect(-14,-80,28,70,8,'#ffe066',OUT,4);rrect(-8,-92,16,16,4,'#7fc4f2',OUT,3);line([[4,-80],[14,-108]],'#ff5a5a',4);
        poly([[30,0],[110,0],[70,-62]],'#f5deb3',OUT,4);poly([[36,-4],[104,-4],[70,-50]],'#7ed957');poly([[44,-8],[96,-8],[70,-40]],'#ff6b6b');ctx.restore();}}
    drawPicnicFX(t);
    // ladybird on the fluttering corner, flies off once the ball pins it
    if(t>12.0){const wf=clothWaveFn(t,cloth.Z,cloth.s);const d=wf(0.02,0.97);const bl=cloth.Q[3];let lx=bl[0]+42+d[0],ly=bl[1]-10+d[1];let wings=0,al=1;
      if(t>14.55){const u=smooth(ramp(t,14.55,14.9));const tgt=bp?[bp.p[0]+2,bp.p[1]-30]:[lx,ly];const sx=lx,sy=ly;lx=lerp(sx,tgt[0],u);ly=lerp(sy,tgt[1],u)-Math.sin(Math.PI*u)*90;wings=t<14.9?1:0;}
      ctx.save();ctx.globalAlpha=al;ctx.translate(lx,ly);if(wings){const f=Math.abs(Math.sin(t*60));ell(-8,-6,10,6*f+2,'rgba(255,255,255,0.85)',OUT,1.5,-0.5);ell(8,-6,10,6*f+2,'rgba(255,255,255,0.85)',OUT,1.5,0.5);}
      ell(0,0,10,8,'#e23b3b',OUT,3);circ(-8,0,5,'#2b2640');line([[0,-7],[0,7]],'#2b2640',2);circ(3,-3,2,'#2b2640');circ(5,3,2,'#2b2640');circ(-2,4,1.6,'#2b2640');ctx.restore();}
  }
  // soft letterbox-free vignette + fade-in
  ctx.setTransform(1,0,0,1,0,0);
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*1.05);vg.addColorStop(0,'rgba(40,30,60,0)');vg.addColorStop(1,'rgba(40,30,60,0.22)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(t>14.72){const u=smooth(ramp(t,14.72,15.0));const bp=picnicBall(t,hz);const c=bp?bp.p:[W/2,H/2];const R=lerp(1500,54,u);
    ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(c[0],c[1],R,0,TAU,true);ctx.fillStyle='#f6f2e6';ctx.fill();ctx.beginPath();ctx.arc(c[0],c[1],R,0,TAU);ctx.lineWidth=8;ctx.strokeStyle=OUT;ctx.stroke();}
  if(t>0.25&&t<1.35){const a=smooth(ramp(t,0.25,0.6))*(1-smooth(ramp(t,1.05,1.35)));ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,118+(1-a)*10);rrect(-330,-40,660,80,40,'#f6f2e6',OUT,5);ctx.fillStyle=OUT;ctx.font='italic bold 40px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('one little ball, one big day',0,2);ctx.restore();}
  if(t>14.86){const a=smooth(ramp(t,14.86,15.0));ctx.save();ctx.globalAlpha=a;ctx.fillStyle=OUT;ctx.font='italic bold 64px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('the end',W/2,H/2-200);ctx.restore();}
  if(t<0.35){ctx.fillStyle=`rgba(255,255,255,${1-ramp(t,0,0.35)})`;ctx.fillRect(0,0,W,H);}
}
window.__frame=function(t){frame(t);return cv.toDataURL('image/png');};
window.__draw=function(t){frame(t);};
const q=new URLSearchParams(location.search);
loadSprites().then(()=>{initRig();window.__ready=true;if(q.has('t'))frame(parseFloat(q.get('t')));});
