<!doctype html>
<html><head><meta charset="utf-8"><title>Six to Picnic</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
// ============================================================================
//  "Six to Picnic" — 15 s, 1920x1080, time-driven 2D cartoon.
//  window.__frame(t) draws the frame for time t (seconds) and returns a PNG data URL.
//  Beats:  0-5 cricket six  ->  seam 1 (ball lands in airbox = launch)
//          5-10 F1 sprint   ->  seam 2 (checkered flag fills frame = blanket)
//          10-15 picnic     ->  cricket ball callback pins the fluttering corner
// ============================================================================
const W=1920,H=1080,TAU=Math.PI*2;
const cv=document.getElementById('c');const ctx=cv.getContext('2d');
const lerp=(a,b,t)=>a+(b-a)*t;const clamp=(x,a,b)=>x<a?a:x>b?b:x;const sat=x=>clamp(x,0,1);
const smooth=x=>{x=sat(x);return x*x*(3-2*x)};
const easeOut=x=>{x=sat(x);return 1-Math.pow(1-x,3)};
const easeIn=x=>{x=sat(x);return x*x*x};
const linear=x=>sat(x);
const ramp=(t,a,b)=>sat((t-a)/(b-a));
function kf(t,keys,ease){ease=ease||smooth;if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const k0=keys[i],k1=keys[i+1];
    if(t<=k1[0]){const e=k1[2]||ease;return lerp(k0[1],k1[1],e((t-k0[0])/(k1[0]-k0[0])));}}
  return keys[keys.length-1][1];}
function kf2(t,keys,ease){return [kf(t,keys.map(k=>[k[0],k[1][0],k[2]]),ease),kf(t,keys.map(k=>[k[0],k[1][1],k[2]]),ease)];}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let LWK=1;const OUT='#2b2640';
function circ(x,y,r,f,s,lw){ctx.beginPath();ctx.arc(x,y,r,0,TAU);if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.lineWidth=(lw||4)*LWK;ctx.strokeStyle=s;ctx.stroke();}}
function ell(x,y,rx,ry,f,s,lw,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,TAU);if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.lineWidth=(lw||4)*LWK;ctx.strokeStyle=s;ctx.stroke();}}
function rrect(x,y,w,h,r,f,s,lw){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.lineWidth=(lw||4)*LWK;ctx.lineJoin='round';ctx.strokeStyle=s;ctx.stroke();}}
function poly(p,f,s,lw,open){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);if(!open)ctx.closePath();if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.lineWidth=(lw||4)*LWK;ctx.lineJoin='round';ctx.strokeStyle=s;ctx.stroke();}}
function line(p,s,lw){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.lineWidth=lw*LWK;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s;ctx.stroke();}
function limb(p,col,w){line(p,OUT,w+7);line(p,col,w);}
function ik(S,T,l1,l2,bend){let dx=T[0]-S[0],dy=T[1]-S[1];let d=Math.hypot(dx,dy)||1e-6;
  if(d>=l1+l2){return [S[0]+dx*l1/d,S[1]+dy*l1/d];}
  const a=(l1*l1-l2*l2+d*d)/(2*d);const h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const px=S[0]+dx*a/d,py=S[1]+dy*a/d;return [px-dy/d*h*bend,py+dx/d*h*bend];}
function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function shade(rgb,k){return `rgb(${clamp(rgb[0]*k,0,255)|0},${clamp(rgb[1]*k,0,255)|0},${clamp(rgb[2]*k,0,255)|0})`;}
function star4(x,y,r,col){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?r*0.35:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fillStyle=col;ctx.fill();}

// ------------------------------------------------------------------ faces
function face(x,y,r,o){o=o||{};const ex=r*0.34,ey=-r*0.02+(o.ly||0)*r*0.08,lx=(o.lx||0)*r*0.1;const er=r*0.1;
  for(const sg of[-1,1]){const cx=x+sg*ex+lx,cy=y+ey;
    if(o.eyes==='happy'){ctx.beginPath();ctx.arc(cx,cy+er*0.8,er*1.4,Math.PI*1.08,Math.PI*1.92);ctx.lineWidth=Math.max(3,r*0.075)*LWK;ctx.strokeStyle=OUT;ctx.lineCap='round';ctx.stroke();}
    else{const rr=o.eyes==='wide'?er*1.4:er*1.05;circ(cx,cy,rr,OUT);circ(cx+rr*0.35,cy-rr*0.35,rr*0.32,'#fff');}}
  if(o.brows){for(const sg of[-1,1]){const cx=x+sg*ex+lx,cy=y+ey-er*2.6-(sg===o.browSide?(o.browUp||0)*r*0.1:0);
    line([[cx-er*1.1,cy+er*0.25*(o.brows>0?-sg:sg)],[cx+er*1.1,cy-er*0.25*(o.brows>0?-sg:sg)]],o.browCol||OUT,Math.max(3,r*0.06));}}
  ell(x-ex-r*0.18+lx,y+r*0.3,r*0.14,r*0.08,'rgba(255,110,140,0.42)');ell(x+ex+r*0.18+lx,y+r*0.3,r*0.14,r*0.08,'rgba(255,110,140,0.42)');
  const my=y+r*0.44;const m=o.mouth||'smile';const mw=Math.max(3,r*0.065)*LWK;
  if(m==='smile'){ctx.beginPath();ctx.arc(x+lx,my-r*0.12,r*0.22,Math.PI*0.15,Math.PI*0.85);ctx.lineWidth=mw;ctx.strokeStyle=OUT;ctx.lineCap='round';ctx.stroke();}
  else if(m==='grin'){ctx.beginPath();ctx.arc(x+lx,my-r*0.14,r*0.27,0,Math.PI);ctx.closePath();ctx.fillStyle='#4a2a3a';ctx.fill();ctx.lineWidth=mw;ctx.strokeStyle=OUT;ctx.lineJoin='round';ctx.stroke();
    ell(x+lx,my+r*0.05,r*0.11,r*0.06,'#ff86a6');}
  else if(m==='o'){ell(x+lx,my,r*0.1,r*0.13,'#4a2a3a',OUT,3);}
  else if(m==='flat'){line([[x+lx-r*0.13,my],[x+lx+r*0.13,my]],OUT,Math.max(3,r*0.06));}
  else if(m==='grit'){rrect(x+lx-r*0.2,my-r*0.07,r*0.4,r*0.14,r*0.05,'#fff',OUT,3);line([[x+lx,my-r*0.07],[x+lx,my+r*0.07]],OUT,2);}
}

// ============================================================================
//  WORLD 1: stadium + race track (one continuous side-view world)
// ============================================================================
const CAR0=3300, AIRBOX=[-55,-182];
function carX(t){if(t<5.35)return CAR0;const u=t-5.35,V=2300,K=0.75;return CAR0+V*(u-K*(1-Math.exp(-u/K)));}
function carV(t){if(t<5.35)return 0;return 2300*(1-Math.exp(-(t-5.35)/0.75));}
const XF=carX(8.6);           // finish line world x
const MX=XF+180;              // marshal world x
function carSquash(t){if(t<5.0)return 1;const u=t-5.0;return 1-0.2*Math.exp(-u*6)*Math.sin(TAU*u*2.3);}
function carTilt(t){const u=t-5.35;if(u<0)return 0;return -0.14*Math.sin(Math.PI*sat(u/0.5))*Math.exp(-u*1.5);}
const HIT=[45,-100],T_HIT=1.3,T_LAND=5.0,GRAV=900;
const LX=CAR0+AIRBOX[0],LY=AIRBOX[1];
const TF=T_LAND-T_HIT,VX=(LX-HIT[0])/TF,VY=(LY-HIT[1]-0.5*GRAV*TF*TF)/TF;
function bowlerX(t){return kf(t,[[0,980],[0.8,330,linear],[1.3,250,easeOut]]);}
function bowlerHand(t){ // delivery hand position before release
  const bx=bowlerX(t);const ph=ramp(t,0.45,0.8);const a=lerp(Math.PI*0.5,-Math.PI*0.85,ph);
  const sx=bx+10,sy=-205;return [sx+Math.cos(a)*70,sy+Math.sin(a)*70];}
function ballPos(t){
  if(t<0.8)return bowlerHand(t);
  if(t<1.07){const u=ramp(t,0.8,1.07);return [lerp(300,165,u),lerp(-230,-14,u*u)];}
  if(t<T_HIT){const u=ramp(t,1.07,T_HIT);return [lerp(165,HIT[0],u),lerp(-14,HIT[1],easeOut(u))];}
  if(t<T_LAND){const u=t-T_HIT;return [HIT[0]+VX*u,HIT[1]+VY*u+0.5*GRAV*u*u];}
  const u=t-T_LAND;const settle=-Math.abs(Math.sin(u*TAU*1.6))*46*Math.exp(-u*5);
  return [carX(t)+AIRBOX[0],AIRBOX[1]*carSquash(t)+settle-6];
}
function ballSpin(t){if(t<T_HIT)return t*20;if(t<T_LAND)return (t-T_HIT)*26;return (T_LAND-T_HIT)*26;}
function flagTheta(t){ // pole tilt from vertical, + = toward +x
  const wave=0.52*Math.sin(TAU*1.45*(t-7.8));const env=smooth(ramp(t,7.5,8.0))*(1-smooth(ramp(t,9.25,9.7)));
  return 0.22+wave*env+0.1*smooth(ramp(t,9.25,9.7));}
function flagQuadWorld(t){const th=flagTheta(t);const hx=MX-34,hy=-410;const dir=[Math.sin(th),-Math.cos(th)],per=[Math.cos(th),Math.sin(th)];
  const L=310,top=[hx+dir[0]*L,hy+dir[1]*L];const TL=top,BL=[top[0]-dir[0]*185,top[1]-dir[1]*185];
  const FL=320;return [TL,[TL[0]+per[0]*FL,TL[1]+per[1]*FL],[BL[0]+per[0]*FL,BL[1]+per[1]*FL],BL,[hx,hy]];}
function quadCenter(Q){return [(Q[0][0]+Q[1][0]+Q[2][0]+Q[3][0])/4,(Q[0][1]+Q[1][1]+Q[2][1]+Q[3][1])/4];}

function shakeAB(t){let a=0;
  if(t>=T_HIT&&t<T_HIT+0.5)a+=14*Math.exp(-(t-T_HIT)*9);
  if(t>=5.0&&t<5.6)a+=10*Math.exp(-(t-5.0)*7);
  if(t>5.3&&t<9.0)a+=1.6*sat(carV(t)/2300)*(1-ramp(t,8.4,9.0));
  return [a*Math.sin(t*173.3)+a*0.5*Math.sin(t*61),a*Math.sin(t*131.7+1)];}
function camAB(t){
  const b=ballPos(t);const pre={x:240,y:-250,z:1.0};
  const f=smooth(ramp(t,1.3,2.0));
  const lead=kf(t,[[1.3,120],[3,260],[5,200],[6.6,470],[9,470]]);
  const ty=b[1]+kf(t,[[1.3,160],[2.6,520],[4.4,260],[5.4,140],[9,120]]);
  let x=lerp(pre.x,b[0]+lead,f),y=lerp(pre.y,ty,f);
  let z=kf(t,[[0,1.22],[1.3,1.25],[1.6,1.1],[3.0,0.36],[4.6,0.62],[5.0,0.8],[5.45,0.98],[6.8,0.72],[8.3,0.72],[9.4,1.6]]);
  const g=smooth(ramp(t,8.3,9.35));const fq=flagQuadWorld(t);const fc=quadCenter(fq);
  x=lerp(x,fc[0],g);y=lerp(y,fc[1],g);
  y=Math.min(y,230-540/z);
  const s=shakeAB(t);return {x:x+s[0]/z,y:y+s[1]/z,z:z};
}
function proj(cam,p){return [(p[0]-cam.x)*cam.z+W/2,(p[1]-cam.y)*cam.z+H/2];}
function applyCam(cam){ctx.setTransform(cam.z,0,0,cam.z,W/2-cam.x*cam.z,H/2-cam.y*cam.z);}

// --- precomputed scenery
const R=rng(7);
const CROWD_COLS=['#ff8a80','#ffd54f','#80d8ff','#b9f6ca','#ea80fc','#ffffff','#ffab91','#8c9eff'];
const standCrowd=[];(function(){for(const side of[-1,1]){for(let k=0;k<9;k++){const y=-90-k*64;const x0=590+k*110;for(let x=x0;x<1660;x+=27){standCrowd.push([side*(x+R()*8),y-R()*6,CROWD_COLS[(R()*CROWD_COLS.length)|0],R()*TAU]);}}}})();
const tileCrowd=[];(function(){for(let r=0;r<4;r++){for(let x=30;x<1170;x+=26){tileCrowd.push([x+R()*8,-150-r*58-R()*6,CROWD_COLS[(R()*CROWD_COLS.length)|0],R()*TAU]);}}})();
const CLOUDS=[];(function(){const r2=rng(21);for(let i=0;i<60;i++){CLOUDS.push({x:-2500+r2()*14000,y:-250-r2()*2600,s:0.6+r2()*1.3,p:0.35+r2()*0.5});}})();
function cloud(x,y,s,alpha){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,60,0,TAU);ctx.arc(60,-14,48,0,TAU);ctx.arc(-62,-6,44,0,TAU);ctx.arc(110,8,36,0,TAU);ctx.arc(-110,12,32,0,TAU);ctx.fill();
  ctx.fillStyle='#e6f2fb';ctx.beginPath();ctx.ellipse(0,32,140,22,0,0,TAU);ctx.fill();ctx.restore();}

function drawSkyAB(cam,t){ctx.setTransform(1,0,0,1,0,0);
  const y0=proj(cam,[0,-3400])[1],y1=proj(cam,[0,120])[1];const g=ctx.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,'#3d8fe0');g.addColorStop(0.55,'#86c9f7');g.addColorStop(1,'#d8f1ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // sun (parallax .15)
  const sp=proj({x:cam.x*0.15,y:cam.y*0.15,z:cam.z},[-900,-1500]);ctx.save();ctx.translate(sp[0],sp[1]);
  ctx.globalAlpha=0.35;ctx.fillStyle='#fff3b0';for(let i=0;i<12;i++){ctx.save();ctx.rotate(i*TAU/12+t*0.1);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-40*cam.z-10,-260*cam.z-60);ctx.lineTo(40*cam.z+10,-260*cam.z-60);ctx.fill();ctx.restore();}
  ctx.globalAlpha=1;circ(0,0,110*cam.z+30,'#ffe680');circ(0,0,80*cam.z+22,'#fff6c2');ctx.restore();
  for(const c of CLOUDS){const p=proj({x:cam.x*c.p,y:cam.y*c.p+(1-c.p)*-800,z:cam.z},[c.x,c.y]);if(p[0]<-400||p[0]>W+400||p[1]<-300||p[1]>H+300)continue;cloud(p[0],p[1],c.s*cam.z*1.3,0.95);}
}
function drawHillsAB(cam){ // parallax layers at ground level
  for(const [p,col,amp,per,yb] of [[0.45,'#9ad67a',120,900,-40],[0.7,'#7fc763',70,520,-10]]){
    const c2={x:cam.x*p,y:cam.y,z:cam.z};applyCam(c2);const x0=c2.x-W/cam.z,x1=c2.x+W/cam.z;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x0,400);
    for(let x=x0;x<=x1+40;x+=40){ctx.lineTo(x,yb-amp*(0.5+0.5*Math.sin(x/per*TAU))-amp*0.3*Math.sin(x/per*1.7*TAU+1));}
    ctx.lineTo(x1,400);ctx.closePath();ctx.fill();
    if(p>0.6){for(let x=Math.floor(x0/300)*300;x<x1;x+=300){const h=70+40*Math.sin(x*0.013);line([[x,0],[x,-h]],'#8a5a3a',14);circ(x,-h-10,55+15*Math.sin(x*0.02),'#4fa85e',OUT,3);}}
  }
  applyCam(cam);
}
function drawGroundAB(cam){applyCam(cam);const x0=cam.x-W/cam.z,x1=cam.x+W/cam.z;ctx.fillStyle='#78c850';ctx.fillRect(x0,0,x1-x0,4000);
  ctx.fillStyle='#6cb846';for(let x=Math.floor(x0/160)*160;x<x1;x+=160){ctx.fillRect(x,40+((x/160)&1)*30,80,10);} }
function drawStadium(t){
  // stands
  for(const s of[-1,1]){poly([[s*560,0],[s*560,-60],[s*1560,-640],[s*1680,-640],[s*1680,0]],'#c9cfe3',OUT,6);
    for(let k=1;k<9;k++){const y=-60-k*64;line([[s*(560+k*110),y],[s*1680,y]],'#aab2cf',6);}
    rrect(s*1680-(s>0?0:60),-640,60,640,0,'#9aa5c8',OUT,5);
    // roof
    poly([[s*1740,-700],[s*700,-440],[s*700,-400],[s*1740,-660]],'#8ea0c8',OUT,5);line([[s*1740,-700],[s*1740,-640]],OUT,6);
    // floodlight
    line([[s*1820,0],[s*1820,-900]],'#9aa3bd',16);rrect(s*1820-70,-980,140,70,14,'#5b6482',OUT,5);for(let i=0;i<4;i++)circ(s*1820-45+i*30,-945,10,'#fff6a0');
  }
  // crowd (bounce after the six)
  const jump=smooth(ramp(t,1.4,2.0));
  for(const c of standCrowd){const j=jump*Math.max(0,Math.sin(t*9+c[3]))*18;circ(c[0],c[1]-j,11,c[2]);circ(c[0],c[1]-j-3,6,'#ffd9b8');}
  // scoreboard
  rrect(-1500,-880,330,150,16,'#2d3250',OUT,6);const pop=t>1.6?smooth(ramp(t,1.6,1.9)):0;
  ctx.save();ctx.translate(-1335,-810);ctx.scale(pop,pop);ctx.fillStyle='#ffd54f';ctx.font='bold 110px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SIX!',0,6);ctx.restore();
  // pitch & stumps
  rrect(-420,-2,840,28,8,'#e4cf9a',OUT,4);line([[-140,0],[-140,-95]],'#f4e7c3',8);line([[-125,0],[-125,-95]],'#f4e7c3',8);line([[-110,0],[-110,-95]],'#f4e7c3',8);line([[-145,-99],[-105,-99]],'#f4e7c3',6);
}
function drawTrack(cam,t){
  const x0=Math.max(2250,cam.x-W/cam.z-200),x1=cam.x+W/cam.z+200;if(x1<2250)return;
  // grandstand strip (period 1200, every third tile is trees)
  for(let k=Math.floor(x0/1200);k*1200<x1;k++){const bx=k*1200;if(bx<2250)continue;
    if(k%3===2){for(let i=0;i<4;i++){const x=bx+150+i*300;line([[x,-110],[x,-230]],'#8a5a3a',16);circ(x,-260,70,'#4fa85e',OUT,4);circ(x-30,-230,45,'#5bb86a');}continue;}
    poly([[bx+20,-110],[bx+1180,-110],[bx+1180,-390],[bx+20,-390]],'#d9dcec',OUT,5);line([[bx+40,-400],[bx+1160,-400]],'#8ea0c8',14);
    for(const c of tileCrowd){circ(bx+c[0],c[1],10,c[2]);circ(bx+c[0],c[1]-3,5.5,'#ffd9b8');}
  }
  // barrier with ad panels (period 700)
  const AD=['#f06a6a','#f5c04a','#64b5f6','#81c784','#ff8fb1'];
  for(let k=Math.floor(x0/700);k*700<x1;k++){const bx=k*700;if(bx+700<2250)continue;const col=AD[((k%AD.length)+AD.length)%AD.length];
    rrect(bx,-108,700,100,0,col);ctx.fillStyle='rgba(255,255,255,0.55)';for(let i=0;i<3;i++){poly([[bx+120+i*200,-100],[bx+180+i*200,-100],[bx+120+i*200,-16],[bx+60+i*200,-16]],'rgba(255,255,255,0.5)');}}
  line([[Math.max(2250,x0),-108],[x1,-108]],OUT,5);line([[Math.max(2250,x0),-8],[x1,-8]],OUT,5);
  for(let x=Math.ceil(Math.max(2250,x0)/300)*300;x<x1;x+=300){rrect(x-6,-120,12,120,3,'#eceff5',OUT,3);}
  // tarmac band + kerb
  ctx.fillStyle='#5d5f6c';ctx.fillRect(Math.max(2250,x0),-6,x1-Math.max(2250,x0),76);
  for(let x=Math.floor(Math.max(2250,x0)/120)*120;x<x1;x+=120){ctx.fillStyle=((x/120)&1)?'#ff5a5a':'#ffffff';ctx.fillRect(x,70,120,14);}
  ctx.fillStyle='#ffffff';ctx.fillRect(Math.max(2250,x0),30,x1-Math.max(2250,x0),4);
  // start grid box + start lights
  rrect(CAR0-40,-4,420,8,0,'#ffd54f');rrect(CAR0+270,-4,8,60,0,'#ffd54f');
  line([[CAR0+360,0],[CAR0+360,-330]],'#5b6482',14);line([[CAR0+360,-330],[CAR0-60,-330]],'#5b6482',14);
  rrect(CAR0-60,-375,330,70,12,'#2d3250',OUT,5);
  const lit=t<5.35?Math.floor(ramp(t,4.0,4.8)*5+0.001):0;
  for(let i=0;i<5;i++)circ(CAR0-20+i*62,-340,20,i<lit?'#ff3b3b':'#3a2b33',OUT,3);
  // finish gantry + banner + checkered line
  ctx.fillStyle='#fff';for(let i=0;i<3;i++)for(let j=0;j<6;j++){ctx.fillStyle=((i+j)&1)?'#222':'#fff';ctx.fillRect(XF-30+i*20,-6+j*12.7,20,12.7);}
  line([[XF+40,0],[XF+40,-520]],'#5b6482',16);line([[XF-600,0],[XF-600,-520]],'#5b6482',16);rrect(XF-620,-560,700,60,10,'#2d3250',OUT,5);

  for(const sg of[-1,1]){const hip=[x+sg*20,hipY];const kn=[lerp(x+sg*26,x+sg*128,sit),lerp(hipY+125,F-60,sit)];const ft=[lerp(x+sg*34,x+sg*44,sit),lerp(F,F-4,sit)];
    limb([hip,kn],'#ffd9b8',34);limb([kn,ft],'#8fd1ff',30);ell(ft[0]+sg*6,ft[1],26,11,'#fff',OUT,4);}

  ctx.save();ctx.translate(x,hipY);ctx.rotate(lean);
  rrect(-66,-178,132,186,30,'#7fc4f2',OUT,5);rrect(-74,-30,148,58,18,'#ffffff',OUT,5);
  rrect(-20,-178,40,22,8,'#ffffff');ctx.fillStyle='#ffffff';ctx.font='bold 70px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('9',0,-88);
  const sh=[[-58,-162],[58,-162]];
  // head
  const hc=[0,-262+bounceB];circ(hc[0]-30,hc[1]-70,32,'#f3cf66',OUT,5);               // bun
  circ(hc[0],hc[1]-6,98,'#f3cf66',OUT,5);                                               // hair cap
  circ(hc[0],hc[1]+10,90,'#ffd9b8',OUT,5);                                              // face
  ctx.beginPath();ctx.arc(hc[0],hc[1]-6,98,Math.PI*1.05,Math.PI*1.95);ctx.lineTo(hc[0]+60,hc[1]-40);ctx.quadraticCurveTo(hc[0]+20,hc[1]-70,hc[0]-20,hc[1]-46);ctx.quadraticCurveTo(hc[0]-50,hc[1]-60,hc[0]-78,hc[1]-32);ctx.closePath();ctx.fillStyle='#f3cf66';ctx.fill();
  ctx.beginPath();ctx.arc(hc[0],hc[1]-6,98,Math.PI*1.05,Math.PI*1.95);ctx.lineWidth=5*LWK;ctx.strokeStyle=OUT;ctx.stroke();
  line([[hc[0]-92,hc[1]-30],[hc[0]+92,hc[1]-30]],'#2b2640',9);                          // headband
  let fo;if(t<10.95)fo={eyes:'wide',mouth:'o',brows:1,browCol:'#d9b24a'};else if(t<12.0)fo={eyes:'open',mouth:'grin',brows:1,browCol:'#d9b24a'};
  else if(t<13.2)fo={eyes:'open',mouth:'smile',brows:1,browCol:'#d9b24a'};else if(t<13.9)fo={eyes:'open',mouth:'flat',lx:-1,ly:0.6,brows:1,browUp:1,browSide:-1,browCol:'#d9b24a'};
  else if(t<14.55)fo={eyes:'open',mouth:'smile',lx:-1,ly:0.8,brows:1,browCol:'#d9b24a'};else fo={eyes:'happy',mouth:'grin',brows:1,browCol:'#d9b24a'};
  face(hc[0],hc[1]+10,88,fo);
  ctx.restore();

  const shW=sh.map(p=>[x+p[0]*Math.cos(lean)-p[1]*Math.sin(lean),hipY+p[0]*Math.sin(lean)+p[1]*Math.cos(lean)]);

}
function drawPicnicFX(t){if(t<14.6)return;const u=ramp(t,14.6,15.0);const r2=rng(3);for(let i=0;i<9;i++){const x=880+r2()*500,y=560+r2()*420,d=r2()*0.3;const k=sat((u-d)/0.5);const s=Math.sin(Math.PI*k)*(14+r2()*14);if(k>0&&k<1)star4(x,y,s,i%2?'#fff6a0':'#ffffff');}

function frame(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);LWK=1;
  let cam=null;
  if(t<10.0){cam=drawWorldAB(t);}

    cam=camAB(t);drawPicnicBG(t);}
  const picnic=t>=10.0;
  let cloth=null;if(t>=7.0){cloth=clothScreenQuad(t,cam);}
  ctx.setTransform(1,0,0,1,0,0);LWK=1;
  let hz=null;
  if(picnic){
    const standingBehind=t<11.9;
    if(standingBehind){hz=drawHaaland(t,cloth.Q,null);}
    drawBasket(1520,905);
  }
  if(cloth){ // flag pole (world) before seam
    if(!picnic){applyCam(cam);LWK=clamp(Math.pow(1/cam.z,0.55),1,2.4);const fw=flagQuadWorld(t);line([fw[4],fw[0]],'#f0e6c8',10);circ(fw[0][0],fw[0][1],12,'#ffd54f',OUT,4);ctx.setTransform(1,0,0,1,0,0);LWK=1;}
    drawCloth(cloth.Q,clothWaveFn(t,cloth.Z,cloth.s),[8,6],4,Math.max(3,4*Math.min(cloth.Z,1.5)));
    if(!picnic){applyCam(cam);LWK=clamp(Math.pow(1/cam.z,0.55),1,2.4);const b=ballPos(t);drawBall(b[0],b[1],19,ballSpin(t),1);ctx.setTransform(1,0,0,1,0,0);LWK=1;}
    if(picnic&&hz&&t<11.0){circ(hz.handL[0],hz.handL[1],18,'#ffd9b8',OUT,4);circ(hz.handR[0],hz.handR[1],18,'#ffd9b8',OUT,4);}
  }
  if(picnic){
    if(t>=11.9){hz=drawHaaland(t,cloth.Q,null);}
    const bp=picnicBall(t,hz?hz.handL:null);
    if(bp){ // dust puffs while rolling
      if(t>13.0&&t<13.9){ctx.globalAlpha=0.5*(1-ramp(t,13.5,13.9));for(let i=0;i<3;i++)circ(bp.p[0]-40-i*35,996-i*6,12+i*6,'#e9efd6');ctx.globalAlpha=1;}
      drawBall(bp.p[0],bp.p[1],22,bp.spin,1);

  ctx.setTransform(1,0,0,1,0,0);
  if(t<0.35){ctx.fillStyle=`rgba(255,255,255,${1-ramp(t,0,0.35)})`;ctx.fillRect(0,0,W,H);}
}
